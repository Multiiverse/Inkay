name: Codeberg sync
permissions:
  contents: read

on:
- push
- workflow_dispatch

jobs:
    codeberg-push:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Codeberg sync
              if: contains(github.event.head_commit.message, '[no sync]') == false
              run: |
                git fetch --unshallow
                git config --global url."https://api:${{secrets.CODEBERG_AUTH}}@codeberg.org/".insteadOf "https://codeberg.org/"
                git remote set-url origin https://codeberg.org/Multiiverse/Inkay.git
                git push --force

name: Codeberg sync
permissions:
  contents: read

on:
- push
- workflow_dispatch

jobs:
    codeberg-push:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - name: Codeberg sync
              if: contains(github.event.head_commit.message, '[no sync]') == false
              run: |
                git fetch --unshallow
                git config --global url."https://api:${{secrets.CODEBERG_AUTH}}@codeberg.org/".insteadOf "https://codeberg.org/"
                git remote set-url origin https://codeberg.org/Multiiverse/Inkay.git
                git push --force
